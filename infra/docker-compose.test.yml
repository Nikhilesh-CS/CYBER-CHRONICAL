services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cyber_chronicle_test
      POSTGRES_USER: cyber_chronicle
      POSTGRES_PASSWORD: cyber_chronicle_test_only
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyber_chronicle -d cyber_chronicle_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
