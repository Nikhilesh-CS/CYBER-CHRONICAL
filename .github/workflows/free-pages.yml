name: Update and publish Cyber Chronicle for free

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cyber-chronicle-pages
  cancel-in-progress: true

jobs:
  update-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the newsroom
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Collect trusted-source metadata
        run: npm run news:update

      - name: Build the static newspaper
        env:
          NEXT_PUBLIC_BASE_PATH: /CYBER-CHRONICAL
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the static newspaper
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
